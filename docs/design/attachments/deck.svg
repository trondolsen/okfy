  <rect x="428" y="1722" width="324" height="28" rx="7" class="row"/>
  <text x="436" y="1741" font-size="13" fill="#9aa2b3">Reference</text>
  <text x="744" y="1741" font-size="11" fill="#9aa2b3" text-anchor="end">3</text>
  <rect x="428" y="1754" width="324" height="28" rx="7" class="rowin"/>
  <text x="436" y="1773" font-size="13" font-weight="600" fill="#ffffff">Guides</text>
  <text x="744" y="1773" font-size="11" fill="#9aa2b3" text-anchor="end">5</text>
  <rect x="428" y="1786" width="324" height="28" rx="7" class="row" opacity="0.42"/>
  <text x="436" y="1805" font-size="13" fill="#9aa2b3" opacity="0.42">Tour</text>
  <text x="744" y="1805" font-size="11" fill="#9aa2b3" text-anchor="end" opacity="0.42">2</text>
  <rect x="428" y="1818" width="324" height="24" rx="7" fill="#5b8def" fill-opacity="0.14"/>
  <text x="590" y="1834" font-size="15" fill="#5b8def" text-anchor="middle">＋</text>

  <text x="156" y="2036" class="sx" text-anchor="middle">two decks, a gap apart</text>
  <text x="590" y="2036" class="sx" text-anchor="middle">the deck menu: the deck that holds the page, the rest dimmed</text>

  <text x="76" y="2068" class="note">Up to eight decks are kept at once, each its own stack, set apart by a gap; every deck looks the same, and</text>
  <text x="76" y="2092" class="note">a click makes one active. Small accent pills count the decks scrolled past an edge of the column.</text>

  <text x="56" y="2164" class="h">5 · Scrolling the column</text>
  <rect x="56" y="2188" width="968" height="392" rx="16" class="panel"/>

  <rect x="140" y="2216" width="120" height="230" rx="10" class="col"/>
