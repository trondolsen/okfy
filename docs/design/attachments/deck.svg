  <rect x="204" y="1314" width="112" height="6" rx="3" class="tbar"/>
  <rect x="204" y="1338" width="112" height="44" rx="6" class="page"/>
  <path d="M 250 1324 L 250 1344 L 255 1339 L 259 1348 L 262 1346 L 258 1338 L 264 1338 Z" fill="#e7e9ee" stroke="#12141a" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="260" y="1484" class="sx" text-anchor="middle">the dragged card follows the pointer</text>

  <rect x="460" y="1246" width="120" height="220" rx="10" class="slot"/>
  <rect x="496" y="1262" width="56" height="80" rx="4" class="card"/>
  <rect x="496" y="1286" width="56" height="80" rx="4" class="card"/>
  <rect x="600" y="1246" width="120" height="220" rx="10" class="slotin"/>
  <rect x="636" y="1262" width="56" height="80" rx="4" class="card"/>
  <rect x="636" y="1286" width="56" height="80" rx="4" class="card"/>
  <rect x="740" y="1246" width="120" height="220" rx="10" class="slotdash"/>
  <rect x="776" y="1262" width="56" height="80" rx="4" class="card"/>
  <rect x="776" y="1286" width="56" height="80" rx="4" class="card"/>

  <text x="520" y="1496" class="sx" text-anchor="middle">outside</text>
  <text x="660" y="1496" class="sx" text-anchor="middle">inside</text>
  <text x="800" y="1496" class="sx" text-anchor="middle">a new deck</text>
  <text x="656" y="1524" class="sx" text-anchor="middle">the drop site: dim outside, lit inside, dashed for a new deck</text>

  <text x="76" y="1556" class="note">The drop site is a separate, fixed-size rectangle, not tied to the deck's own size: it spans the column from</text>
  <text x="76" y="1580" class="note">near the top of the window down near its bottom, and is shown for the whole drag. A release clear of every</text>
  <text x="76" y="1604" class="note">stack starts a new deck rather than a new slot, so the site reads as a fresh one.</text>

  <text x="56" y="1664" class="h">4 · Several decks, and the menu</text>
  <rect x="56" y="1688" width="968" height="422" rx="16" class="panel"/>

