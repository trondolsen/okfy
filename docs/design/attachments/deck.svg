  <text x="250" y="584" class="sx" text-anchor="middle">at rest</text>
  <text x="610" y="584" class="sx" text-anchor="middle">hovering a card parts its neighbours</text>

  <text x="76" y="616" class="note">The deck has no panel: the cards float on the right edge and only their shadows mark it. Each card shows</text>
  <text x="76" y="640" class="note">a header strip — the top of its page screenshot — and the last card is fully visible at the bottom.</text>
  <text x="76" y="664" class="note">Hovering one repels its neighbours, so the pointed-at card is revealed a little further.</text>

  <text x="56" y="754" class="h">2 · The card</text>
  <rect x="56" y="778" width="968" height="352" rx="16" class="panel"/>

  <rect x="96" y="806" width="140" height="198" rx="6" class="cardhot"/>
  <rect x="110" y="822" width="112" height="14" rx="4" fill="#c9d0da"/>
