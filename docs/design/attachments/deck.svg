<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2640" viewBox="0 0 1080 2640" role="img" aria-labelledby="t d" lang="en" xml:lang="en">
  <title id="t">The deck of cards — okfy design proposal</title>
  <desc id="d">The deck of cards. It has no panel: the cards float on the right edge, marked only by their shadows, and a card is a small paper-like slip. The cards of a deck overlap so each shows a header strip — the top of its page screenshot — with the last card fully visible at the bottom, and hovering a card repels its neighbours so the pointed-at one is revealed a little further. Two tiny tab chips ride the stack: a kind chip on the top card, above its top edge, naming the deck's most prominent kind, and a tag chip under the bottom card on the right, naming the most prominent tag; both highlight with the accent while any card is pointed at. A card carries the page screenshot, and two bare glyphs appear on hover — a remove cross at the top right that reddens, and a sub-deck expand chevron at the top left that gains a round accent highlight. A card can be hovered (accent border, deeper shadow, an inner accent glow), current (a solid accent ring for the page open in the preview) or flashing (a fading accent ring for a card just added). Up to eight decks are kept at once, each its own stack set apart by a gap, with small accent pills counting the decks scrolled past an edge. A dragged card is a real card following the pointer, and the drop site is a separate fixed-size rectangle — dim while the card is outside it, lighter inside, and dashed when a release there would start a new deck. The deck menu lists the decks with their page counts, highlighting the one that holds the page and dimming the rest, with a plus at the foot for a new deck.</desc>
