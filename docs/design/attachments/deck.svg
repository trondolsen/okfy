  <text x="56" y="52" class="eyebrow">OKFY · DESIGN PROPOSAL</text>
  <text x="56" y="110" class="title">The deck of cards</text>
  <text x="56" y="148" class="subtitle">Small page cards that float on the edge, overlap to a strip and repel on hover</text>

