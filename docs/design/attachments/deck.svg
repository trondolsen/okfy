  <rect x="660" y="806" width="140" height="198" rx="6" class="cardhot"/>
  <rect x="654" y="800" width="152" height="210" rx="9" class="ringsoft"/>
  <rect x="674" y="822" width="80" height="10" rx="4" fill="#c9d0da"/>

  <text x="96" y="1044" class="sx">the card</text>
  <text x="370" y="1044" class="sx" text-anchor="middle">hovered</text>
  <text x="550" y="1044" class="sx" text-anchor="middle">current</text>
  <text x="730" y="1044" class="sx" text-anchor="middle">flash</text>

  <text x="76" y="1076" class="note">The remove cross sits at the top right and reddens on hover; the expand chevron, on a sub-deck, sits at the</text>
  <text x="76" y="1100" class="note">top left with a round accent highlight. Hovered adds a glow, current a solid ring, flash a fading one.</text>

  <text x="56" y="1184" class="h">3 · The drag and the drop site</text>
  <rect x="56" y="1208" width="968" height="402" rx="16" class="panel"/>

  <rect x="196" y="1252" width="140" height="198" rx="6" fill="#000000" fill-opacity="0.5"/>
