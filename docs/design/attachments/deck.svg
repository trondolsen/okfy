    <rect x="140" y="2422" width="120" height="24" class="room"/>
  </g>
  <rect x="198" y="2220" width="46" height="14" rx="7" fill="#5b8def"/>
  <text x="221" y="2231" font-size="9" fill="#ffffff" text-anchor="middle">▲ 1</text>
  <rect x="198" y="2426" width="46" height="14" rx="7" fill="#5b8def"/>
  <text x="221" y="2437" font-size="9" fill="#ffffff" text-anchor="middle">▼ 2</text>
  <text x="286" y="2238" class="sx">edge pills count the decks past the edge</text>
  <text x="286" y="2436" class="sx">the empty scroll room below the decks</text>
  <text x="200" y="2474" class="sx" text-anchor="middle">the column: a fixed scroll area</text>

  <rect x="560" y="2216" width="140" height="230" rx="10" class="col"/>
  <line x1="588" y1="2252" x2="588" y2="2408" stroke="#9aa2b3" stroke-width="2"/>
  <path d="M582 2262 L588 2250 L594 2262 Z" fill="#9aa2b3"/>
  <path d="M582 2398 L588 2410 L594 2398 Z" fill="#9aa2b3"/>
  <path d="M660 2320 L660 2340 L665 2335 L669 2344 L672 2342 L668 2334 L674 2334 Z" fill="#e7e9ee" stroke="#12141a" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="630" y="2474" class="sx" text-anchor="middle">the empty space is dragged to scroll</text>

  <text x="76" y="2506" class="note">The column scrolls with no visible scrollbar and keeps its scroll while it is rebuilt, and it returns home when</text>
  <text x="76" y="2530" class="note">it empties. The decks rest at the top of the visible area, with a column-height of empty room above and below,</text>
  <text x="76" y="2554" class="note">so they can be dragged or scrolled out of view either way. A dragged card near an edge scrolls the column.</text>

  <text x="56" y="2624" class="note">A card dragged from a node is a real card, so it looks identical to a docked one until it lands.</text>
</svg>
