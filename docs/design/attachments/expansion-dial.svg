<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1500" viewBox="0 0 1080 1500" role="img" aria-labelledby="t d" lang="en" xml:lang="en">
  <title id="t">A dial for expanding and collapsing directories and tags — okfy design proposal</title>
  <desc id="d">Press and hold a directory or tag node and a radial dial opens around it with four expansion modes, each drawn as a small graph pictogram of nodes and links instead of words: expand more adds one more neighbour, expand all shows every neighbour, recursive expand all opens the whole subtree below, and collapsed holds everything back into the single node. Dashed rings are held-back neighbours. Modes that do not apply are drawn faded. A drag to a mode and release applies it; releasing in the middle cancels.</desc>
  <defs>
    <style>
      /* The viewer's own palette: the dark theme's CSS variables and the node colours from
         the script (directories, index files, files, the accent), so the figure matches the
tool. */
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #e7e9ee; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #5b8def; }
      .title { font-size: 44px; font-weight: 700; fill: #e7e9ee; }
      .subtitle { font-size: 22px; fill: #9aa2b3; }
      .h { font-size: 26px; font-weight: 700; fill: #e7e9ee; }
      .ct { font-size: 20px; font-weight: 700; fill: #e7e9ee; }
      .body { font-size: 17px; font-weight: 700; fill: #e7e9ee; }
      .note { font-size: 17px; fill: #9aa2b3; }
      .nn { font-size: 17px; font-weight: 700; fill: #e7e9ee; }
      .sm { font-size: 14px; font-weight: 700; fill: #e7e9ee; }
      .sx { font-size: 13px; fill: #9aa2b3; }
      .sec { fill: #1b1e27; stroke: #2e3341; stroke-width: 2; }
      .sec-off { fill: #171a21; stroke: #232734; stroke-width: 2; }
      .sec-hi { fill: #232734; stroke: #5b8def; stroke-width: 4; }
      .partfill { fill: #8b93a7; }
      .dashout { fill: none; stroke: #5b8def; stroke-width: 2.5; stroke-dasharray: 6 5; }
      .edge { fill: none; stroke: #6a7488; stroke-width: 2.5; }
      .panel { fill: #171a21; stroke: #262b36; stroke-width: 2; }
      .on { fill: #5b8def; }
      .offring { fill: none; stroke: #47506a; stroke-width: 2; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a7488"/>
    </marker>

    <g id="ip1">
      <line x1="-16" y1="0" x2="4" y2="-9" stroke="#6a7488" stroke-width="2"/>
      <line x1="-16" y1="0" x2="4" y2="9" stroke="#6a7488" stroke-width="2"/>
      <line x1="-16" y1="0" x2="18" y2="0" stroke="#5b8def" stroke-width="2"/>
      <path d="M 12 0 L 6.5 -3.5 L 6.5 3.5 Z" fill="#5b8def"/>
      <circle cx="-16" cy="0" r="5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.5"/>
      <circle cx="4" cy="-9" r="5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.5"/>
      <circle cx="4" cy="9" r="5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.5"/>
      <circle cx="18" cy="0" r="5" fill="#5b8def" stroke="#4a6fa5" stroke-width="1.5"/>
    </g>
    <g id="ip2">
      <line x1="-16" y1="0" x2="6" y2="-11" stroke="#6a7488" stroke-width="2"/>
      <line x1="-16" y1="0" x2="12" y2="0" stroke="#6a7488" stroke-width="2"/>
      <line x1="-16" y1="0" x2="6" y2="11" stroke="#6a7488" stroke-width="2"/>
      <circle cx="-16" cy="0" r="5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.5"/>
      <circle cx="6" cy="-11" r="5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.5"/>
      <circle cx="12" cy="0" r="5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.5"/>
      <circle cx="6" cy="11" r="5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.5"/>
    </g>
    <g id="ip3">
      <line x1="-19" y1="0" x2="-2" y2="-10" stroke="#6a7488" stroke-width="2"/>
      <line x1="-19" y1="0" x2="-2" y2="10" stroke="#6a7488" stroke-width="2"/>
      <line x1="-2" y1="-10" x2="11" y2="-15" stroke="#6a7488" stroke-width="1.6"/>
      <line x1="-2" y1="-10" x2="11" y2="-5" stroke="#6a7488" stroke-width="1.6"/>
      <line x1="-2" y1="10" x2="11" y2="5" stroke="#6a7488" stroke-width="1.6"/>
      <line x1="-2" y1="10" x2="11" y2="15" stroke="#6a7488" stroke-width="1.6"/>
      <circle cx="-19" cy="0" r="4.5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.5"/>
      <circle cx="-2" cy="-10" r="4.5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.5"/>
      <circle cx="-2" cy="10" r="4.5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.5"/>
      <circle cx="11" cy="-15" r="3.5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.3"/>
      <circle cx="11" cy="-5" r="3.5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.3"/>
      <circle cx="11" cy="5" r="3.5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.3"/>
      <circle cx="11" cy="15" r="3.5" fill="#8b93a7" stroke="#6f7b92" stroke-width="1.3"/>
    </g>
    <g id="ip4">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#5b8def" stroke-width="2.5" stroke-dasharray="5 4"/>
    </g>
  </defs>

  <rect width="1080" height="1500" fill="#12141a"/>
  <rect width="1080" height="8" fill="#5b8def"/>
  <text x="56" y="60" class="eyebrow">OKFY · DESIGN PROPOSAL</text>
  <text x="56" y="118" class="title">A dial of expansion modes</text>
  <text x="56" y="156" class="subtitle">Press and hold a directory or tag node; each mode is a graph pictogram</text>

  <text x="56" y="224" class="h">1 · The gesture</text>
  <rect x="56" y="248" width="968" height="268" rx="16" class="panel"/>

  <text x="110" y="294" class="ct">Press and hold</text>
  <text x="110" y="320" class="note">hold about 0.5 s; the ring fills</text>
  <path class="edge" d="M 208 410 L 316 370 M 208 410 L 316 410 M 208 410 L 316 450"/>
  <circle cx="190" cy="410" r="18" class="partfill"/>
  <circle cx="190" cy="410" r="19" class="dashout"/>
  <path d="M 190 380 A 30 30 0 1 1 172.4 434.3" fill="none" stroke="#5b8def" stroke-width="3" stroke-linecap="round"/>
  <circle cx="316" cy="370" r="9" fill="#8b93a7" stroke="#6f7b92" stroke-width="2"/>
  <circle cx="316" cy="410" r="9" fill="#8b93a7" stroke="#6f7b92" stroke-width="2"/>
  <circle cx="316" cy="450" r="9" fill="#8b93a7" stroke="#6f7b92" stroke-width="2"/>
  <text x="190" y="470" class="note" text-anchor="middle">docs/</text>

  <path class="edge" d="M 486 410 H 552"/>
  <path d="M 546 404 L 556 410 L 546 416 Z" fill="#6a7488"/>

  <text x="620" y="294" class="ct">The dial opens</text>
  <text x="620" y="320" class="note">the node keeps its state and place</text>
  <g transform="translate(760,410) scale(0.62)">
    <path class="sec" d="M -70.5 -87 A 112 112 0 0 1 70.5 -87 L 30.2 -37.3 A 48 48 0 0 0 -30.2 -37.3 Z"/>
    <path class="sec" d="M 87 -70.5 A 112 112 0 0 1 87 70.5 L 37.3 30.2 A 48 48 0 0 0 37.3 -30.2 Z"/>
    <path class="sec" d="M 70.5 87 A 112 112 0 0 1 -70.5 87 L -30.2 37.3 A 48 48 0 0 0 30.2 37.3 Z"/>
    <path class="sec" d="M -87 70.5 A 112 112 0 0 1 -87 -70.5 L -37.3 -30.2 A 48 48 0 0 0 -37.3 30.2 Z"/>
    <use href="#ip2" transform="translate(0,-80)"/>
    <use href="#ip3" transform="translate(80,0)"/>
    <use href="#ip4" transform="translate(0,80)"/>
    <use href="#ip1" transform="translate(-80,0)"/>
  </g>
  <circle cx="760" cy="410" r="12" class="partfill"/>
  <circle cx="760" cy="410" r="13" class="dashout"/>
  <text x="760" y="504" class="note" text-anchor="middle">docs/</text>

  <text x="56" y="562" class="h">2 · The modes, clockwise from the top</text>
  <rect x="56" y="586" width="968" height="424" rx="16" class="panel"/>

  <g transform="translate(300,790)">
    <path class="sec" d="M -70.5 -87 A 112 112 0 0 1 70.5 -87 L 30.2 -37.3 A 48 48 0 0 0 -30.2 -37.3 Z"/>
    <path class="sec" d="M 87 -70.5 A 112 112 0 0 1 87 70.5 L 37.3 30.2 A 48 48 0 0 0 37.3 -30.2 Z"/>
    <path class="sec" d="M 70.5 87 A 112 112 0 0 1 -70.5 87 L -30.2 37.3 A 48 48 0 0 0 30.2 37.3 Z"/>
    <path class="sec" d="M -87 70.5 A 112 112 0 0 1 -87 -70.5 L -37.3 -30.2 A 48 48 0 0 0 -37.3 30.2 Z"/>
    <use href="#ip2" transform="translate(0,-80) scale(1.2)"/>
    <use href="#ip3" transform="translate(80,0) scale(1.2)"/>
    <use href="#ip4" transform="translate(0,80) scale(1.2)"/>
    <use href="#ip1" transform="translate(-80,0) scale(1.2)"/>
  </g>
  <circle cx="300" cy="790" r="24" class="partfill"/>
  <circle cx="300" cy="790" r="25" class="dashout"/>
  <text x="300" y="948" class="note" text-anchor="middle">docs/ · 3 of 9 shown</text>

  <use href="#ip2" transform="translate(584,699) scale(0.9)"/>
  <text x="624" y="706" class="nn">Expand all</text>
  <text x="624" y="728" class="note">show every neighbour of this node</text>

  <use href="#ip3" transform="translate(584,763) scale(0.9)"/>
  <text x="624" y="770" class="nn">Recursive expand all</text>
  <text x="624" y="792" class="note">open the whole subtree below</text>

  <use href="#ip4" transform="translate(584,827) scale(0.9)"/>
  <text x="624" y="834" class="nn">Collapsed</text>
  <text x="624" y="856" class="note">hold the neighbours and the subtree back</text>

  <use href="#ip1" transform="translate(584,891) scale(0.9)"/>
  <text x="624" y="898" class="nn">Expand more</text>
  <text x="624" y="920" class="note">reveal the next page of neighbours</text>

  <text x="624" y="950" class="note">A mode that does not apply is drawn faded.</text>
  <text x="624" y="974" class="note">Release in the middle, or press Esc, to cancel.</text>

  <text x="56" y="1056" class="h">3 · When each mode applies</text>
  <rect x="56" y="1080" width="968" height="280" rx="16" class="panel"/>

  <text x="480" y="1104" class="sm" text-anchor="middle">Collapsed</text>
  <text x="480" y="1122" class="sx" text-anchor="middle">0 shown</text>
  <text x="570" y="1104" class="sm" text-anchor="middle">Partial</text>
  <text x="570" y="1122" class="sx" text-anchor="middle">k shown</text>
  <text x="660" y="1104" class="sm" text-anchor="middle">Fully shown</text>
  <text x="660" y="1122" class="sx" text-anchor="middle">M of M</text>

  <use href="#ip2" transform="translate(122,1154) scale(0.6)"/>
  <text x="160" y="1160" class="body">Expand all</text>
  <circle cx="480" cy="1160" r="6" class="on"/>
  <circle cx="570" cy="1160" r="6" class="on"/>
  <circle cx="660" cy="1160" r="6" class="offring"/>

  <use href="#ip3" transform="translate(122,1194) scale(0.6)"/>
  <text x="160" y="1200" class="body">Recursive expand all</text>
  <circle cx="480" cy="1200" r="6" class="on"/>
  <circle cx="570" cy="1200" r="6" class="on"/>
  <circle cx="660" cy="1200" r="6" class="on"/>

  <use href="#ip4" transform="translate(122,1234) scale(0.6)"/>
  <text x="160" y="1240" class="body">Collapsed</text>
  <circle cx="480" cy="1240" r="6" class="offring"/>
  <circle cx="570" cy="1240" r="6" class="on"/>
  <circle cx="660" cy="1240" r="6" class="on"/>

  <use href="#ip1" transform="translate(122,1274) scale(0.6)"/>
  <text x="160" y="1280" class="body">Expand more</text>
  <circle cx="480" cy="1280" r="6" class="on"/>
  <circle cx="570" cy="1280" r="6" class="on"/>
  <circle cx="660" cy="1280" r="6" class="offring"/>

  <text x="90" y="1326" class="note">A filled dot means the mode applies; a hollow ring means it is faded.</text>

  <text x="830" y="1104" class="ct" text-anchor="middle">Choosing</text>
  <g transform="translate(830,1205) scale(0.62)">
    <path class="sec" d="M -70.5 -87 A 112 112 0 0 1 70.5 -87 L 30.2 -37.3 A 48 48 0 0 0 -30.2 -37.3 Z"/>
    <path class="sec" d="M 87 -70.5 A 112 112 0 0 1 87 70.5 L 37.3 30.2 A 48 48 0 0 0 37.3 -30.2 Z"/>
    <path class="sec" d="M 70.5 87 A 112 112 0 0 1 -70.5 87 L -30.2 37.3 A 48 48 0 0 0 30.2 37.3 Z"/>
    <path class="sec" d="M -87 70.5 A 112 112 0 0 1 -87 -70.5 L -37.3 -30.2 A 48 48 0 0 0 -37.3 30.2 Z"/>
    <path class="sec-off" d="M 70.5 87 A 112 112 0 0 1 -70.5 87 L -30.2 37.3 A 48 48 0 0 0 30.2 37.3 Z"/>
    <path class="sec-hi" d="M -70.5 -87 A 112 112 0 0 1 70.5 -87 L 30.2 -37.3 A 48 48 0 0 0 -30.2 -37.3 Z"/>
    <use href="#ip2" transform="translate(0,-80)"/>
    <use href="#ip3" transform="translate(80,0)"/>
    <use href="#ip4" transform="translate(0,80)" opacity="0.3"/>
    <use href="#ip1" transform="translate(-80,0)"/>
  </g>
  <circle cx="830" cy="1205" r="15" class="dashout"/>
  <path class="edge" d="M 830 1186 L 830 1160" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="830" y="1325" class="note" text-anchor="middle">collapsed node: drag out to a mode</text>

  <text x="56" y="1400" class="note">Replaces the current click-to-page and press-and-hold-to-collapse: the dial is one gesture for both.</text>
  <text x="56" y="1432" class="note">A plain click keeps the node's own action; press and hold a concept still starts a deck card.</text>
  <text x="56" y="1464" class="note">Tag hubs use the same dial; the recursive mode differs only for directories.</text>
</svg>
