<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1490" viewBox="0 0 1080 1490" role="img" aria-labelledby="t d" lang="en" xml:lang="en">
  <title id="t">Iconography — okfy design proposal</title>
  <desc id="d">The tool's marks. Nothing is imported: there is no icon font, sprite sheet or image file. A drawn mark is an inline SVG on a 24 by 24 grid — a speaker, a microphone, the settings sliders, a context ring, a replay arrow and a stop square — plus the wordmark, four node circles in the node colours joined by links, drawn at 96 by 32 in the toolbar. A type mark is a character the interface already has: the toolbar glyph, a caret, a card's open and close arrows, back and forward, the add-to-deck handle, a remove cross, an add plus, a check, play and pause, the token arrows, the budget symbol, the highlight dot and an external footnote arrow. A drawn mark uses currentColor, so it is muted when idle, in the text colour in use, and the accent when it is on or hovered, while a mark that removes reddens instead. The token arrows and the context ring animate a fill rather than a colour: an accent copy is revealed by a clip that grows, and the ring sweeps an accent arc around a muted track.</desc>
  <defs>
    <style>
      /* The viewer's own palette: the dark theme's CSS variables, so the figure reads as the
         tool does and matches the sibling design figures. */
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #e7e9ee; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #5b8def; }
      .title { font-size: 44px; font-weight: 700; fill: #e7e9ee; }
      .subtitle { font-size: 22px; fill: #9aa2b3; }
      .h { font-size: 26px; font-weight: 700; fill: #e7e9ee; }
      .note { font-size: 17px; fill: #9aa2b3; }
      .sm { font-size: 14px; font-weight: 700; fill: #e7e9ee; }
      .sx { font-size: 13px; fill: #9aa2b3; }
      .tile { fill: #1b1e27; stroke: #2e3341; stroke-width: 2; }
      .panel { fill: #171a21; stroke: #262b36; stroke-width: 2; }
      .glyph { font-size: 22px; fill: #e7e9ee; }
      .ar-base { fill: #9aa2b3; }
      .ar-fill { fill: #5b8def; }
      .brandletter { fill: #ffffff; }
    </style>
    <g id="i-speaker">
      <path d="M4 9v6h4l5 4V5L8 9H4Z" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M16.4 9.2a4.2 4.2 0 0 1 0 5.6" fill="none" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M18.8 6.8a7.6 7.6 0 0 1 0 10.4" fill="none" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="i-mic">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M6 11a6 6 0 0 0 12 0" fill="none" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M12 17v4" fill="none" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="i-sliders">
      <path d="M4 3v18M12 3v18M20 3v18" fill="none" stroke-width="2" stroke-linecap="round"/>
      <circle cx="4" cy="9" r="3"/><circle cx="12" cy="15" r="3"/><circle cx="20" cy="7" r="3"/>
    </g>
    <g id="i-ring">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#9aa2b3" stroke-opacity=".3" stroke-width="3"/>
      <circle cx="12" cy="12" r="9" fill="none" stroke="#5b8def" stroke-width="3" stroke-dasharray="34 999" transform="rotate(-90 12 12)"/>
    </g>
    <g id="i-replay">
      <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8Z"/>
    </g>
    <g id="i-stop"><rect x="6" y="6" width="12" height="12" rx="2.5"/></g>
    <g id="i-brand">
      <path d="M60.5 37 L99.5 43 M99.5 43 L140.5 37 M140.5 37 L179.5 43" fill="none" stroke="#6a7488" stroke-width="3" stroke-linecap="round"/>
      <circle cx="60.5" cy="37" r="16" fill="#8b93a7"/>
      <circle cx="99.5" cy="43" r="16" fill="#5b8def"/>
      <circle cx="140.5" cy="37" r="16" fill="#c9a24d"/>
      <circle cx="179.5" cy="43" r="16" fill="#a274d6"/>
      <g class="brandletter" font-weight="800" font-size="20" text-anchor="middle">
        <text x="60.5" y="44">o</text>
        <text x="99.5" y="50">k</text>
        <text x="140.5" y="44">f</text>
        <text x="179.5" y="50">y</text>
      </g>
    </g>
    <clipPath id="fill25"><rect x="446" y="1200" width="28" height="40"/></clipPath>
    <clipPath id="fill60"><rect x="546" y="1190" width="28" height="40"/></clipPath>
    <clipPath id="fill100"><rect x="646" y="1178" width="28" height="40"/></clipPath>
  </defs>

  <rect width="1080" height="1490" fill="#12141a"/>
  <rect width="1080" height="8" fill="#5b8def"/>
  <text x="56" y="52" class="eyebrow">OKFY · DESIGN PROPOSAL</text>
  <text x="56" y="110" class="title">Iconography</text>
  <text x="56" y="148" class="subtitle">Drawn marks and type marks, with no icon font and no image files</text>

  <text x="56" y="214" class="h">1 · The drawn marks</text>
  <rect x="56" y="238" width="968" height="414" rx="16" class="panel"/>

  <rect x="96" y="290" width="76" height="76" rx="12" class="tile"/>
  <use href="#i-speaker" transform="translate(114.8,308.8) scale(1.6)" fill="#e7e9ee" stroke="#e7e9ee"/>
  <rect x="232" y="290" width="76" height="76" rx="12" class="tile"/>
  <use href="#i-mic" transform="translate(250.8,308.8) scale(1.6)" fill="#e7e9ee" stroke="#e7e9ee"/>
  <rect x="368" y="290" width="76" height="76" rx="12" class="tile"/>
  <use href="#i-sliders" transform="translate(386.8,308.8) scale(1.6)" fill="#e7e9ee" stroke="#e7e9ee"/>
  <rect x="504" y="290" width="76" height="76" rx="12" class="tile"/>
  <use href="#i-ring" transform="translate(522.8,308.8) scale(1.6)"/>
  <rect x="640" y="290" width="76" height="76" rx="12" class="tile"/>
  <use href="#i-replay" transform="translate(658.8,308.8) scale(1.6)" fill="#e7e9ee" stroke="none"/>
  <rect x="776" y="290" width="76" height="76" rx="12" class="tile"/>
  <use href="#i-stop" transform="translate(794.8,308.8) scale(1.6)" fill="#e7e9ee" stroke="none"/>

  <text x="134" y="392" class="sx" text-anchor="middle">speaker</text>
  <text x="270" y="392" class="sx" text-anchor="middle">microphone</text>
  <text x="406" y="392" class="sx" text-anchor="middle">settings</text>
  <text x="542" y="392" class="sx" text-anchor="middle">context ring</text>
  <text x="678" y="392" class="sx" text-anchor="middle">replay</text>
  <text x="814" y="392" class="sx" text-anchor="middle">stop</text>

  <text x="96" y="426" class="note">Six drawn marks, each an inline SVG on a 24×24 grid: a speaker (the audio toggle and the volume), a microphone,</text>
  <text x="96" y="450" class="note">the settings sliders, a context ring, a replay arrow and a stop square.</text>

  <use href="#i-brand" transform="translate(96,486) scale(1.28)"/>
  <text x="390" y="512" class="note">the wordmark: four node circles in the node colours, joined by links,</text>
  <text x="390" y="536" class="note">drawn at 96×32 in the toolbar and as plain text in the About panel</text>

  <text x="96" y="600" class="note">The dial's four modes and the node states are the graph's own pictograms, so they live in the expansion figures.</text>
  <text x="96" y="624" class="note">Every drawn mark uses currentColor, so it takes the colour of the control it sits in.</text>

  <text x="56" y="696" class="h">2 · The type marks</text>
  <rect x="56" y="720" width="968" height="332" rx="16" class="panel"/>

  <rect x="96" y="762" width="44" height="44" rx="10" class="tile"/>
  <text x="118" y="792" class="glyph" text-anchor="middle">☰</text>
  <rect x="214" y="762" width="44" height="44" rx="10" class="tile"/>
  <text x="236" y="792" class="glyph" text-anchor="middle">▾</text>
  <rect x="332" y="762" width="44" height="44" rx="10" class="tile"/>
  <text x="354" y="792" class="glyph" text-anchor="middle">▸</text>
  <rect x="450" y="762" width="44" height="44" rx="10" class="tile"/>
  <text x="472" y="792" class="glyph" text-anchor="middle">‹</text>
  <rect x="568" y="762" width="44" height="44" rx="10" class="tile"/>
  <text x="590" y="792" class="glyph" text-anchor="middle">›</text>
  <rect x="686" y="762" width="44" height="44" rx="10" class="tile"/>
  <text x="708" y="792" class="glyph" text-anchor="middle">⋮</text>
  <rect x="804" y="762" width="44" height="44" rx="10" class="tile"/>
  <text x="826" y="792" class="glyph" text-anchor="middle">×</text>

  <text x="118" y="830" class="sx" text-anchor="middle">toolbar</text>
  <text x="236" y="830" class="sx" text-anchor="middle">title caret</text>
  <text x="354" y="830" class="sx" text-anchor="middle">expand a card</text>
  <text x="472" y="830" class="sx" text-anchor="middle">back</text>
  <text x="590" y="830" class="sx" text-anchor="middle">forward</text>
  <text x="708" y="830" class="sx" text-anchor="middle">add to deck</text>
  <text x="826" y="830" class="sx" text-anchor="middle">remove</text>

  <rect x="96" y="862" width="44" height="44" rx="10" class="tile"/>
  <text x="118" y="892" class="glyph" text-anchor="middle">＋</text>
  <rect x="214" y="862" width="44" height="44" rx="10" class="tile"/>
  <text x="236" y="892" class="glyph" text-anchor="middle">✓</text>
  <rect x="332" y="862" width="44" height="44" rx="10" class="tile"/>
  <text x="354" y="892" class="glyph" text-anchor="middle">▶</text>
  <rect x="450" y="862" width="44" height="44" rx="10" class="tile"/>
  <text x="472" y="892" class="glyph" text-anchor="middle">❚❚</text>
  <rect x="568" y="862" width="44" height="44" rx="10" class="tile"/>
  <text x="590" y="892" class="glyph" text-anchor="middle">◎</text>
  <rect x="686" y="862" width="44" height="44" rx="10" class="tile"/>
  <text x="708" y="892" class="glyph" text-anchor="middle">●</text>
  <rect x="804" y="862" width="44" height="44" rx="10" class="tile"/>
  <text x="826" y="892" class="glyph" text-anchor="middle">↗</text>

  <text x="118" y="930" class="sx" text-anchor="middle">add a provider</text>
  <text x="236" y="930" class="sx" text-anchor="middle">added / included</text>
  <text x="354" y="930" class="sx" text-anchor="middle">play</text>
  <text x="472" y="930" class="sx" text-anchor="middle">pause</text>
  <text x="590" y="930" class="sx" text-anchor="middle">token budget</text>
  <text x="708" y="930" class="sx" text-anchor="middle">highlight dot</text>
  <text x="826" y="930" class="sx" text-anchor="middle">a URL footnote</text>

  <text x="96" y="974" class="note">Some marks are the interface's own characters rather than drawings — the same glyphs the tool already uses, so no icon</text>
  <text x="96" y="998" class="note">font ships. ✓ marks the chosen or the included, × removes, ＋ adds, and ▸ and ▾ open and close a card's pages.</text>

  <text x="56" y="1096" class="h">3 · How a mark takes its colour</text>
  <rect x="56" y="1120" width="968" height="292" rx="16" class="panel"/>

  <text x="96" y="1152" class="sm">the same mark, three colours</text>
  <use href="#i-speaker" transform="translate(114.8,1179.2) scale(1.6)" fill="#9aa2b3" stroke="#9aa2b3"/>
  <use href="#i-speaker" transform="translate(194.8,1179.2) scale(1.6)" fill="#e7e9ee" stroke="#e7e9ee"/>
  <use href="#i-speaker" transform="translate(274.8,1179.2) scale(1.6)" fill="#5b8def" stroke="#5b8def"/>
  <text x="134" y="1250" class="sx" text-anchor="middle">muted</text>
  <text x="214" y="1250" class="sx" text-anchor="middle">in use</text>
  <text x="294" y="1250" class="sx" text-anchor="middle">on or hovered</text>

  <text x="410" y="1152" class="sm">a growing fill</text>
  <text x="460" y="1206" class="ar-base" font-size="34" text-anchor="middle">↑</text>
  <text x="460" y="1206" class="ar-fill" font-size="34" text-anchor="middle" clip-path="url(#fill25)">↑</text>
  <text x="560" y="1206" class="ar-base" font-size="34" text-anchor="middle">↑</text>
  <text x="560" y="1206" class="ar-fill" font-size="34" text-anchor="middle" clip-path="url(#fill60)">↑</text>
  <text x="660" y="1206" class="ar-base" font-size="34" text-anchor="middle">↑</text>
  <text x="660" y="1206" class="ar-fill" font-size="34" text-anchor="middle" clip-path="url(#fill100)">↑</text>
  <text x="460" y="1250" class="sx" text-anchor="middle">25 %</text>
  <text x="560" y="1250" class="sx" text-anchor="middle">60 %</text>
  <text x="660" y="1250" class="sx" text-anchor="middle">100 %</text>

  <circle cx="790" cy="1200" r="20" fill="none" stroke="#9aa2b3" stroke-opacity=".3" stroke-width="6"/>
  <circle cx="790" cy="1200" r="20" fill="none" stroke="#5b8def" stroke-width="6" stroke-dasharray="37.7 999" transform="rotate(-90 790 1200)"/>
  <circle cx="890" cy="1200" r="20" fill="none" stroke="#9aa2b3" stroke-opacity=".3" stroke-width="6"/>
  <circle cx="890" cy="1200" r="20" fill="none" stroke="#5b8def" stroke-width="6" stroke-dasharray="94.2 999" transform="rotate(-90 890 1200)"/>
  <text x="790" y="1250" class="sx" text-anchor="middle">30 %</text>
  <text x="890" y="1250" class="sx" text-anchor="middle">75 %</text>

  <text x="96" y="1300" class="note">A drawn mark inherits the colour of the control it sits in, so one speaker reads as idle, in use or on, while a mark</text>
  <text x="96" y="1324" class="note">that removes reddens instead. The token arrows reveal an accent copy through a clip that grows — the up arrow from</text>
  <text x="96" y="1348" class="note">the bottom and the down arrow from the top — and the context ring sweeps an accent arc around its muted track.</text>

  <text x="56" y="1456" class="note">Marks are drawn, not imported: inline SVG symbols and the interface's own characters — no icon font and no image files.</text>
</svg>
