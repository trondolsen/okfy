<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1460" viewBox="0 0 1080 1460" role="img" aria-labelledby="t d" lang="en" xml:lang="en">
  <title id="t">Panels and their edge tabs — okfy design proposal</title>
  <desc id="d">Three surfaces dock to the viewport edges and slide in and out from behind their own tab: the assistant panel and the filters sidebar on the right, the legend on the left. Each tab sits on the panel's inner edge, is rotated so its label reads down the edge, and keeps its inner border transparent in every state so no seam is drawn where it meets the panel. The filters tab's top follows the assistant tab's bottom, so the assistant's is the upper of the pair. The deck docks left of the filters sidebar, and the panels sit above the deck. Below 760px the top bar stacks and the extra groups collapse behind a hamburger.</desc>
  <defs>
    <style>
      /* The viewer's own palette: the dark theme's CSS variables, so the figure reads as the
         tool does and matches the sibling expansion figures. */
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #e7e9ee; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #5b8def; }
      .title { font-size: 44px; font-weight: 700; fill: #e7e9ee; }
      .subtitle { font-size: 22px; fill: #9aa2b3; }
      .h { font-size: 26px; font-weight: 700; fill: #e7e9ee; }
      .ct { font-size: 20px; font-weight: 700; fill: #e7e9ee; }
      .body { font-size: 17px; font-weight: 700; fill: #e7e9ee; }
      .note { font-size: 17px; fill: #9aa2b3; }
      .sm { font-size: 14px; font-weight: 700; fill: #e7e9ee; }
      .sx { font-size: 13px; fill: #9aa2b3; }
      .panel { fill: #171a21; stroke: #262b36; stroke-width: 2; }
      .card { fill: #1b1e27; stroke: #2e3341; stroke-width: 2; }
      .wire { fill: #12141a; stroke: #262b36; stroke-width: 2; }
      .box { fill: #1b1e27; stroke: #2e3341; stroke-width: 2; }
      .pill { fill: #232734; stroke: #3b4358; stroke-width: 1.5; }
      .tab { fill: #232734; stroke: #3b4358; stroke-width: 1.5; }
      .edge { fill: none; stroke: #2e3341; stroke-width: 2; }
      .dash { fill: none; stroke: #47506a; stroke-width: 2; stroke-dasharray: 6 5; }
      .hot { fill: none; stroke: #5b8def; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1080" height="1460" fill="#12141a"/>
  <rect width="1080" height="8" fill="#5b8def"/>
  <text x="56" y="52" class="eyebrow">OKFY · DESIGN PROPOSAL</text>
  <text x="56" y="110" class="title">Panels and their edge tabs</text>
  <text x="56" y="148" class="subtitle">Each docked panel slides out from behind its own tab on the inner edge</text>

  <text x="56" y="214" class="h">1 · Where each panel docks</text>
  <rect x="56" y="238" width="968" height="406" rx="16" class="panel"/>

  <rect x="96" y="268" width="888" height="300" rx="10" class="wire"/>
  <rect x="204" y="282" width="460" height="32" rx="8" class="box"/>
  <rect x="212" y="288" width="140" height="20" rx="9" class="pill"/>
  <text x="282" y="302" class="sx" text-anchor="middle">title · stats</text>
  <rect x="360" y="288" width="110" height="20" rx="9" class="pill"/>
  <text x="415" y="302" class="sx" text-anchor="middle">file actions</text>
  <rect x="478" y="288" width="90" height="20" rx="9" class="pill"/>
  <text x="523" y="302" class="sx" text-anchor="middle">view</text>
  <rect x="576" y="288" width="80" height="20" rx="9" class="pill"/>
  <text x="616" y="302" class="sx" text-anchor="middle">nav</text>

  <rect x="96" y="268" width="96" height="300" rx="10" class="box"/>
  <text x="144" y="304" class="sm" text-anchor="middle">Legend</text>
  <rect x="192" y="426" width="12" height="58" rx="3" class="tab"/>
  <text x="144" y="556" class="sx" text-anchor="middle">left edge</text>

  <rect x="268" y="340" width="260" height="180" rx="10" class="box"/>
  <text x="398" y="364" class="sx" text-anchor="middle">preview overlay</text>
  <text x="240" y="556" class="sx" text-anchor="middle">graph canvas</text>

  <rect x="612" y="376" width="44" height="150" rx="6" class="box"/>
  <rect x="606" y="384" width="44" height="150" rx="6" class="box"/>
  <rect x="600" y="392" width="44" height="150" rx="6" class="box"/>
  <text x="628" y="562" class="sx" text-anchor="middle">deck</text>

  <rect x="676" y="268" width="124" height="300" rx="10" class="box"/>
  <text x="738" y="304" class="sm" text-anchor="middle">Filters</text>
  <rect x="664" y="346" width="12" height="58" rx="3" class="tab"/>

  <rect x="800" y="268" width="184" height="300" rx="10" class="box"/>
  <text x="892" y="304" class="sm" text-anchor="middle">Assistant</text>
  <rect x="788" y="282" width="12" height="58" rx="3" class="tab"/>

  <text x="120" y="596" class="note">The assistant docks outermost on the right, the filters sidebar inside it, and the legend on the left.</text>
  <text x="120" y="620" class="note">Each panel carries its tab on the inner edge — the edge that faces the canvas.</text>

  <text x="56" y="684" class="h">2 · The tab, in its states</text>
  <rect x="56" y="708" width="968" height="310" rx="16" class="panel"/>

  <rect x="76" y="734" width="296" height="258" rx="14" class="card"/>
  <text x="100" y="770" class="ct">Panel open</text>
  <rect x="130" y="806" width="170" height="96" rx="8" class="box"/>
  <rect x="118" y="820" width="12" height="58" rx="3" class="tab"/>
  <text x="215" y="860" class="sx" text-anchor="middle">panel</text>
  <text x="100" y="926" class="note">rotated label, blends in</text>
  <text x="100" y="950" class="note">inner border transparent</text>

  <rect x="388" y="734" width="296" height="258" rx="14" class="card"/>
  <text x="412" y="770" class="ct">Panel closed</text>
  <path class="dash" d="M 442 800 V 908"/>
  <rect x="430" y="820" width="12" height="58" rx="3" class="tab"/>
  <text x="570" y="846" class="sx" text-anchor="middle">the panel has slid off</text>
  <text x="570" y="868" class="sx" text-anchor="middle">the edge, out of view</text>
  <text x="412" y="926" class="note">the tab stays on screen</text>
  <text x="412" y="950" class="note">the panel slides away</text>

  <rect x="700" y="734" width="296" height="258" rx="14" class="card"/>
  <text x="724" y="770" class="ct">Pointer over the tab</text>
  <rect x="754" y="806" width="170" height="96" rx="8" class="box"/>
  <path class="hot" d="M 754 820 L 742 820 L 742 878 L 754 878"/>
  <text x="839" y="860" class="sx" text-anchor="middle">panel</text>
  <text x="724" y="926" class="note">hover: the accent borders</text>
  <text x="724" y="950" class="note">stop at the panel</text>

  <text x="56" y="1070" class="h">3 · Stacking, and small screens</text>
  <rect x="56" y="1094" width="968" height="272" rx="16" class="panel"/>

  <rect x="200" y="1130" width="320" height="200" rx="8" class="box"/>
  <rect x="188" y="1146" width="12" height="58" rx="3" class="tab"/>
  <text x="226" y="1180" class="sx">Assistant tab</text>
  <rect x="188" y="1210" width="12" height="58" rx="3" class="tab"/>
  <text x="226" y="1244" class="sx">Filters tab</text>
  <text x="96" y="1352" class="note">The filters tab follows the assistant tab's bottom.</text>

  <text x="560" y="1150" class="note">Below 760px the top bar stacks and the</text>
  <text x="560" y="1176" class="note">extra groups collapse behind a hamburger.</text>
  <text x="560" y="1202" class="note">Both panels dock and slide behind their tabs.</text>
  <text x="560" y="1228" class="note">Opening one collapses the other when they do</text>
  <text x="560" y="1254" class="note">not both fit; the sidebar then sits behind the</text>
  <text x="560" y="1280" class="note">open assistant, so both tabs stay in view.</text>
  <text x="560" y="1306" class="note">A tap outside an open panel dismisses it.</text>

  <text x="56" y="1408" class="note">The deck docks left of the filters sidebar, so it clears the assistant too; the legend and both side</text>
  <text x="56" y="1434" class="note">panels sit above the deck, and the node tooltip is drawn above the deck but below the panels.</text>
</svg>
