<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1400" viewBox="0 0 1080 1400" role="img" aria-labelledby="t d" lang="en" xml:lang="en">
  <title id="t">Media file kinds — okfy design proposal</title>
  <desc id="d">Media means the audio and video file kinds. The kind is decided by the extension: audio (mp3, m4a, aac, wav, ogg, oga, opus, flac, weba, aif, aiff), video (mp4, m4v, webm, ogv, mov, mkv), and the WebVTT captions track that sits beside a clip. Each is a file node, drawn in the graph and never read into it; its bytes are read only when the preview opens, within a byte bound. Audio plays through the Web Audio graph, so it draws the same rolling mel spectrogram the assistant's speech bubbles use, with the transport laid over its foot. Video plays in a plain media element with the browser's own controls. Both carry one volume control — a speaker button with a vertical slider above it — shared between the two players and remembered across reloads, and a drag on the seek bar scrubs. A sibling WebVTT track gives captions over the clip and is a page of its own, opening as a transcript of time and words through the same document renderer. A clip too large to read shows a notice naming its size, the limit it is read under and the way out.</desc>
