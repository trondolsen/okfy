  <rect x="96" y="1250" width="284" height="132" rx="8" class="canvas"/>
  <circle cx="312" cy="1278" r="11" fill="#c9a24d" fill-opacity="0.6"/>
  <path d="M108 1376 L196 1288 L246 1342 L280 1308 L368 1376 Z" fill="#8b93a7" fill-opacity="0.45"/>
