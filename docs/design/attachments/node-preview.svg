  <text x="720" y="1218" class="sec">FILE</text>
  <line x1="718" y1="1230" x2="718" y2="1330" stroke="#2e3341" stroke-width="2"/>
  <text x="732" y="1248" font-size="12" fill="#9aa2b3">Path</text>
  <text x="820" y="1248" font-size="12" fill="#e7e9ee">media/talk.mp3</text>
  <text x="732" y="1270" font-size="12" fill="#9aa2b3">Size</text>
  <text x="820" y="1270" font-size="12" fill="#e7e9ee">1.2 MB</text>
  <text x="732" y="1292" font-size="12" fill="#9aa2b3">Type</text>
  <text x="820" y="1292" font-size="12" fill="#e7e9ee">audio/mpeg</text>
  <text x="732" y="1314" font-size="12" fill="#9aa2b3">Captions</text>
  <text x="820" y="1314" font-size="12" fill="#e7e9ee">talk.vtt · 42 cues</text>
  <text x="844" y="1432" class="sx" text-anchor="middle">file details: a definition list</text>

  <text x="76" y="1480" class="note">By kind: a concept or index renders its Markdown, a file shows its source text, and a binary has no</text>
  <text x="76" y="1504" class="note">preview of its own, so it lists the file's details instead. One volume control serves both players.</text>

  <text x="56" y="1566" class="note">The preview shows one page at a time; reading a deck reuses the same card, with its controls hidden.</text>
</svg>
