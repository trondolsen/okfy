  <rect class="sp1" x="456" y="1242" width="13" height="58" rx="2"/>
  <rect class="sp2" x="478" y="1262" width="13" height="38" rx="2"/>
  <rect class="sp1" x="500" y="1232" width="13" height="68" rx="2"/>
  <rect class="sp2" x="522" y="1266" width="13" height="34" rx="2"/>
  <rect class="sp1" x="544" y="1248" width="13" height="52" rx="2"/>
  <rect class="sp2" x="566" y="1274" width="13" height="26" rx="2"/>
  <rect class="sp1" x="588" y="1253" width="13" height="47" rx="2"/>
  <rect class="sp2" x="610" y="1239" width="13" height="61" rx="2"/>
  <rect class="sp1" x="632" y="1269" width="13" height="31" rx="2"/>
  <rect class="sp2" x="654" y="1259" width="13" height="41" rx="2"/>
  <text x="542" y="1284" font-size="10" fill="#e7e9ee" text-anchor="middle">the words being spoken</text>
  <circle cx="416" cy="1320" r="11" fill="none" stroke="#2e3341" stroke-width="1.5"/>
  <circle cx="446" cy="1320" r="11" fill="none" stroke="#2e3341" stroke-width="1.5"/>
  <text x="446" y="1324" font-size="9" fill="#e7e9ee" text-anchor="middle">▶</text>
