  <rect x="160" y="402" width="264" height="30" rx="6" class="btn"/>
  <rect x="172" y="412" width="160" height="5" rx="2" class="codebar"/>
  <rect x="172" y="422" width="118" height="5" rx="2" class="codebar"/>
  <text x="296" y="502" class="sx" text-anchor="middle">centred over the graph, behind a 55 % black scrim</text>

  <text x="520" y="300" class="note">One reused panel for every node: opening an entry replaces</text>
  <text x="520" y="324" class="note">the content and scrolls it back to the top. It is one card</text>
  <text x="520" y="348" class="note">up to 840 × 940 px, rounded, deep-shadowed, one header row.</text>
  <text x="520" y="380" class="note">The preview opens only for a file, a concept or an index; a</text>
  <text x="520" y="404" class="note">tag hub and a directory have no page of their own.</text>

  <rect x="96" y="532" width="888" height="50" rx="10" class="card"/>
  <rect x="108" y="544" width="30" height="26" rx="6" class="btn" opacity="0.45"/>
  <text x="123" y="563" class="br" text-anchor="middle" opacity="0.45">‹</text>
  <rect x="146" y="544" width="30" height="26" rx="6" class="btn" opacity="0.45"/>
  <text x="161" y="563" class="br" text-anchor="middle" opacity="0.45">›</text>
  <text x="194" y="563" font-size="15" font-weight="600">Graph model</text>
  <text x="312" y="562" font-size="12" fill="#9aa2b3">docs/model/graph-model.md</text>
  <text x="846" y="563" font-size="15" fill="#9aa2b3">⋮</text>
  <rect x="870" y="544" width="100" height="26" rx="6" class="btn"/>
  <text x="920" y="562" class="br" text-anchor="middle">Close</text>

  <text x="120" y="608" class="sx" text-anchor="middle">back</text>
  <text x="164" y="608" class="sx" text-anchor="middle">forward</text>
  <text x="300" y="608" class="sx" text-anchor="middle">title and path</text>
  <text x="846" y="608" class="sx" text-anchor="middle">add to deck</text>
  <text x="920" y="608" class="sx" text-anchor="middle">Close</text>

  <text x="56" y="694" class="h">2 · The page</text>
  <rect x="56" y="718" width="968" height="402" rx="16" class="panel"/>

