  <rect x="96" y="274" width="400" height="200" rx="12" class="canvas"/>
  <path d="M150 330 L400 348 M150 330 L188 428 M400 348 L420 432" fill="none" stroke="#232734" stroke-width="2"/>
  <circle cx="150" cy="330" r="7" fill="#2b303c"/>
  <circle cx="400" cy="348" r="7" fill="#2b303c"/>
  <circle cx="188" cy="428" r="7" fill="#2b303c"/>
  <circle cx="420" cy="432" r="7" fill="#2b303c"/>
  <rect x="96" y="274" width="400" height="200" rx="12" fill="#000000" fill-opacity="0.55"/>
  <rect x="152" y="300" width="288" height="152" rx="12" fill="#000000" fill-opacity="0.5"/>
  <rect x="148" y="296" width="288" height="152" rx="12" class="card"/>
  <rect x="158" y="306" width="16" height="14" rx="4" class="btn"/>
