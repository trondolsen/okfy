<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="t d" lang="en" xml:lang="en">
  <title id="t">The node preview — okfy design proposal</title>
  <desc id="d">The page panel a node opens. Clicking a node opens the preview: one reused panel, centred over the graph behind a 55 percent black scrim, with a card up to 840 by 940 pixels, rounded, deep-shadowed and carrying one header row. The header has back and forward (disabled until there is history), the title and the path on one line, both ellipsised, an add-to-deck handle and Close. The body opens with the page's frontmatter as chips, then the rendered Markdown; a text-based image page adds a Show source toggle to the chips row. By kind, a concept or index renders its Markdown, a file shows its source text, a binary shows its file details as a definition list, and an audio or video clip plays with the shared mel spectrogram, one volume control and WebVTT captions over it. A tag or directory has no page, so only a file opens here, and the deck's reading stream reuses the same card with its header controls hidden.</desc>
  <defs>
    <style>
