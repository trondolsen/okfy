  <text x="195" y="760" class="sx" text-anchor="middle">graph</text>
  <rect x="228" y="746" width="52" height="20" rx="10" class="chip"/>
  <text x="254" y="760" class="sx" text-anchor="middle">model</text>
  <rect x="878" y="746" width="106" height="20" rx="10" class="chip"/>
  <text x="931" y="760" class="br" text-anchor="middle" font-size="11">Show source</text>

  <text x="96" y="802" font-size="20" font-weight="700">Graph model</text>
  <line x1="96" y1="814" x2="984" y2="814" stroke="#2e3341" stroke-width="1.5"/>
  <rect x="96" y="834" width="888" height="6" rx="3" class="tbar"/>
  <rect x="96" y="850" width="856" height="6" rx="3" class="tbar"/>
  <rect x="96" y="866" width="470" height="6" rx="3" class="tbar"/>
  <rect x="578" y="866" width="110" height="6" rx="3" class="link"/>
  <rect x="96" y="892" width="600" height="62" rx="8" class="btn"/>
  <rect x="110" y="906" width="300" height="5" rx="2" class="codebar"/>
  <rect x="110" y="920" width="360" height="5" rx="2" class="codebar"/>
  <rect x="110" y="934" width="220" height="5" rx="2" class="codebar"/>
  <line x1="98" y1="968" x2="98" y2="1000" stroke="#2e3341" stroke-width="3"/>
  <rect x="114" y="972" width="420" height="5" rx="2" fill="#6a7488" fill-opacity="0.6"/>
  <rect x="114" y="986" width="320" height="5" rx="2" fill="#6a7488" fill-opacity="0.6"/>

  <text x="76" y="1040" class="note">The body opens with the page's frontmatter as chips, then the rendered Markdown — headings, links,</text>
  <text x="76" y="1064" class="note">code, lists, quotes and tables — all from one bounded renderer, so pathological input shows a notice.</text>
  <text x="76" y="1088" class="note">The Show source toggle sits at the end of the chips row on a text-based image page.</text>

  <text x="56" y="1174" class="h">3 · By kind</text>
  <rect x="56" y="1198" width="968" height="332" rx="16" class="panel"/>

  <rect x="96" y="1220" width="40" height="18" rx="9" class="chip"/>
  <text x="116" y="1233" class="sx" text-anchor="middle" font-size="10">SVG</text>
