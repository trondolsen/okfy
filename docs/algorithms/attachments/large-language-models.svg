<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2470" viewBox="0 0 1080 2470" role="img" aria-labelledby="t d" lang="en" xml:lang="en">
  <title id="t">How a large language model works — okfy algorithm explainer</title>
  <desc id="d">What a large language model does in one call, and what its environment has to supply. The model is a next-token predictor: in one call it sees only the tokens inside its context window, and it has no memory between calls, so the harness re-sends the whole window every time — the system prompt, the conversation and the tool results. The text is split by the model's tokenizer into ids; each id becomes a learned vector and a position signal is added, because order matters. A stack of decoder-only transformer blocks then mixes information: attention lets each position weight the positions before it, a causal mask keeps anything later from leaking in, and a feed-forward network transforms each position on its own; every block keeps a residual connection and a normalisation. The final layer produces one score per token in the vocabulary, and a softmax turns those scores into a probability distribution over the next token. Sampling picks a single token from that distribution, with temperature, top-p and top-k reshaping it, appends the token to the window and runs the whole model again — so a reply is generated one token at a time, and streaming is just those tokens arriving as they are made. Generation stops at an end token, a stop sequence or the output cap. Everything else is the environment. The model cannot read a file, run a command, open a socket or remember yesterday; it can only turn tokens into tokens. The harness assembles the context, sends the request to the provider, executes any tool call the model emits, appends the result to the window and asks again, and it enforces the limits. A tool call is only text that names a tool and passes arguments matching its schema: the model never runs anything, so nothing it writes executes on its own. Because the model sees only the window, anything the harness leaves out does not exist to it, and anything it puts in is indistinguishable from instructions — which is why bundle text is treated as data.</desc>
